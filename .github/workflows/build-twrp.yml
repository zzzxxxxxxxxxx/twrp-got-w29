name: Build TWRP for GOT-W29

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-twrp.yml"
      - "device/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush python3 rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk unzip zstd
          sudo mkdir -p /workdir
          sudo chown -R "$USER:$(id -gn)" /workdir

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /workdir

      - name: Restore repo cache
        id: repo-cache
        uses: actions/cache/restore@v4
        with:
          path: /workdir/twrp-12.1-repo-cache.tar.zst
          key: twrp-12.1-repo-tar-v2
          restore-keys: |
            twrp-12.1-repo-tar-

      - name: Prepare repo and source
        run: |
          sudo chown -R "$USER:$(id -gn)" /workdir
          mkdir -p "$HOME/bin" /workdir/aosp
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          if [ -s /workdir/twrp-12.1-repo-cache.tar.zst ]; then
            tar --zstd -xf /workdir/twrp-12.1-repo-cache.tar.zst -C /workdir/aosp
          fi
          cd /workdir/aosp
          repo init --depth=1 --partial-clone \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync -n -c -j4 --force-sync --no-clone-bundle --no-tags
          du -sh .repo
          tar --zstd -cf /workdir/twrp-12.1-repo-cache.tar.zst -C /workdir/aosp .repo
          ls -lh /workdir/twrp-12.1-repo-cache.tar.zst
          df -h

      - name: Save repo cache
        if: success() && steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /workdir/twrp-12.1-repo-cache.tar.zst
          key: twrp-12.1-repo-tar-v2

      - name: Check out source
        run: |
          export PATH="$HOME/bin:$PATH"
          cd /workdir/aosp
          repo sync -l -j4 --force-sync
          df -h

      - name: Copy device tree
        run: |
          mkdir -p "/workdir/aosp/device/huawei/got_w29"
          rsync -a --delete \
            "$GITHUB_WORKSPACE/device/huawei/got_w29/" \
            "/workdir/aosp/device/huawei/got_w29/"

      - name: Build recovery
        run: |
          cd /workdir/aosp
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_got_w29-eng
          mka recoveryimage -j"$(nproc)"

      - name: Package GOT-W29 images
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_package.py" \
            --recovery "/workdir/aosp/out/target/product/got_w29/recovery.img" \
            --template "$GITHUB_WORKSPACE/device/huawei/got_w29/prebuilt/recovery_ramdisk_header.bin" \
            --out-dir "$GITHUB_WORKSPACE/out"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-GOT-W29-${{ github.run_number }}
          path: |
            out/*.img
            out/*.sha256
          if-no-files-found: error
          compression-level: 0

